<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DrivePulse | 7-Day Prep</title><script src="https://cdn.tailwindcss.com"></script>
<style>html{filter:grayscale(1)} /* prototype look: delete this line for colour */</style></head>
<body class="bg-slate-100 text-slate-900">
<aside class="hidden md:flex w-60 flex-col bg-slate-900 text-slate-200 p-5 fixed inset-y-0"><div class="text-xl font-extrabold text-white mb-8">Drive<span class="text-slate-400">Pulse</span></div><nav class="space-y-1 text-sm font-medium"><a href="index.html" class="block px-3 py-2.5 rounded-lg">🏠 Home</a><a href="debriefs.html" class="block px-3 py-2.5 rounded-lg">📋 Debriefs</a><a href="pathways.html" class="block px-3 py-2.5 rounded-lg">🗓️ 7-Day Prep</a><a href="post.html" class="block px-3 py-2.5 rounded-lg">➕ Post Debrief</a><a href="companies.html" class="block px-3 py-2.5 rounded-lg">🏢 Companies</a><a href="profile.html" class="block px-3 py-2.5 rounded-lg">👤 My Profile</a></nav><p class="mt-auto text-xs text-slate-400">Facts over rumors. Every debrief is backed by an offer letter.</p></aside>
<nav class="md:hidden flex overflow-x-auto gap-2 p-2 bg-slate-900 text-xs"><a href="index.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">🏠 Home</a><a href="debriefs.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">📋 Debriefs</a><a href="pathways.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">🗓️ 7-Day Prep</a><a href="post.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">➕ Post Debrief</a><a href="companies.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">🏢 Companies</a><a href="profile.html" class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">👤 My Profile</a></nav>
<main class="md:ml-60 p-4 md:p-8 max-w-5xl">
<h1 class="text-2xl font-extrabold">7-Day Prep Pathway</h1><p class="text-sm text-slate-600 mb-4">Pick a company and tick tasks as you finish them.</p>
<div id="tabs" class="flex flex-wrap gap-2 mb-4"></div>
<!-- TODO: topic distribution chart, save progress, tasks from real debriefs -->
<div class="bg-white rounded-xl border p-5"><div class="flex justify-between mb-2"><b id="nm"></b><span id="p" class="font-bold"></span></div>
<div class="h-3 bg-slate-200 rounded-full mb-4"><div id="bar" class="h-full bg-slate-800 rounded-full" style="width:0"></div></div><div id="days" class="space-y-2"></div></div>
</main>
<script>
const P={"Bajwa Systems":["Arrays + sliding window","DP basics (1D)","DP on grids + knapsack","SQL essentials","System design lite","Mock OA (90 min)","HR + project deep-dive"],
"Gill & Rao Technologies":["SQL joins","Aggregations + CTEs","Window functions","Indexing + optimisation","Schema design","Python data cleaning","Mock test + HR"],
"Sandhu Infotech":["Quant aptitude","Logical reasoning","OS + DBMS basics","OOPs + easy coding","Puzzles","Mock aptitude test","HR prep"]};
let co=Object.keys(P)[0];const done={};
function draw(){document.getElementById("tabs").innerHTML=Object.keys(P).map(k=>`<button data-c="${k}" class="border-2 rounded-lg px-4 py-2 text-sm font-semibold ${k===co?"bg-slate-900 text-white border-slate-900":"bg-white"}">${k}</button>`).join("");
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{co=b.dataset.c;draw()});
document.getElementById("nm").textContent=co+" · 7-Day Countdown";
document.getElementById("days").innerHTML=P[co].map((t,i)=>`<label class="flex gap-2 border rounded-lg p-3 text-sm"><input type="checkbox" data-k="${co}${i}" ${done[co+i]?"checked":""}> <b>${7-i} days left · Day ${i+1}:</b> ${t}</label>`).join("");
document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{done[c.dataset.k]=c.checked;draw()});
const n=P[co].filter((_,i)=>done[co+i]).length,r=Math.round(n/7*100);
document.getElementById("bar").style.width=r+"%";document.getElementById("p").textContent=n+"/7 · "+r+"%"}
draw();
</script></body></html>
