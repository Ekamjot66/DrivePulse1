<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DrivePulse | 7-Day Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-900">
<aside class="hidden md:flex w-60 flex-col bg-slate-900 text-slate-200 p-5 fixed inset-y-0"><div class="text-xl font-extrabold text-white mb-8">Drive<span class="text-indigo-400">Pulse</span></div><nav class="space-y-1 text-sm font-medium"><a href="index.html"  class="block px-3 py-2.5 rounded-lg hover:bg-slate-800">🏠 Home</a><a href="debriefs.html"  class="block px-3 py-2.5 rounded-lg hover:bg-slate-800">📋 Debriefs</a><a href="pathways.html" aria-current="page" class="block px-3 py-2.5 rounded-lg bg-indigo-600 text-white">🗓️ 7-Day Prep</a><a href="post.html"  class="block px-3 py-2.5 rounded-lg hover:bg-slate-800">➕ Post Debrief</a><a href="companies.html"  class="block px-3 py-2.5 rounded-lg hover:bg-slate-800">🏢 Companies</a><a href="profile.html"  class="block px-3 py-2.5 rounded-lg hover:bg-slate-800">👤 My Profile</a></nav><p class="mt-auto text-xs text-slate-400">Facts over rumors. Every debrief is backed by an offer letter.</p></aside><nav class="md:hidden sticky top-0 z-10 flex overflow-x-auto gap-2 p-2 bg-slate-900 text-xs"><a href="index.html"  class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">🏠 Home</a><a href="debriefs.html"  class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">📋 Debriefs</a><a href="pathways.html" aria-current="page" class="whitespace-nowrap px-3 py-2 rounded-lg bg-indigo-600 text-white">🗓️ 7-Day Prep</a><a href="post.html"  class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">➕ Post Debrief</a><a href="companies.html"  class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">🏢 Companies</a><a href="profile.html"  class="whitespace-nowrap px-3 py-2 rounded-lg text-slate-300">👤 My Profile</a></nav>
<main class="md:ml-60 p-4 md:p-8 max-w-5xl">
<h1 class="text-2xl font-extrabold">Company 7-Day Prep Pathways</h1><p class="text-sm text-slate-600 mb-4">Pick a company and tick tasks. Progress is saved.</p>
<div id="tabs" class="flex flex-wrap gap-2 mb-4"></div>
<div class="bg-white rounded-xl border border-slate-200 p-5"><div class="flex justify-between mb-2"><h2 id="coName" class="font-bold"></h2><span id="pct" class="font-bold text-emerald-700"></span></div>
<div class="h-3 bg-slate-200 rounded-full mb-4 overflow-hidden"><div id="bar" class="h-full bg-emerald-500 transition-all" style="width:0"></div></div><div id="days" class="space-y-2"></div></div>
</main>
<script src="db.js"></script>
<script>
const P=DB.data.pathways,S=DB.data.state;
const want=new URLSearchParams(location.search).get("c");let co=P[want]?want:Object.keys(P)[0];
function draw(){$("tabs").innerHTML=Object.keys(P).map(k=>`<button data-c="${esc(k)}" class="border-2 rounded-lg px-4 py-2 text-sm font-semibold ${k===co?"bg-indigo-600 text-white border-indigo-600":"bg-white border-slate-300 hover:border-indigo-600"}">${esc(k)}</button>`).join("");
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{co=b.dataset.c;draw()});
$("coName").textContent=co+" · 7-Day Countdown";
$("days").innerHTML=P[co].map((t,i)=>{const on=S.done[co+"|"+i];return `<label class="flex items-center gap-2 border border-slate-200 rounded-lg p-3 text-sm cursor-pointer ${on?"bg-emerald-50 text-slate-500 line-through":""}"><input type="checkbox" data-i="${i}" ${on?"checked":""} class="w-4 h-4 accent-emerald-600"> <span class="bg-slate-900 text-white text-xs font-bold rounded px-2 py-0.5 no-underline">${7-i} days left</span> <span><b>Day ${i+1}:</b> ${esc(t)}</span></label>`}).join("");
document.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{S.done[co+"|"+c.dataset.i]=c.checked;DB.save();draw()});
const n=P[co].filter((_,i)=>S.done[co+"|"+i]).length,r=Math.round(n/P[co].length*100);
$("bar").style.width=r+"%";$("pct").textContent=n+"/"+P[co].length+" · "+r+"%"}
draw();
</script></body></html>
