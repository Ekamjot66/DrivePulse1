<div id="g" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>
<script>
const COMPANIES=[{"name": "Sandhu Infotech", "sector": "IT Services", "ctc": "4.5 LPA", "cgpa": 6.0, "rounds": "OA, Technical, HR", "diff": "Easy"}, {"name": "Bajwa Systems", "sector": "Product / SaaS", "ctc": "9 LPA", "cgpa": 7.5, "rounds": "OA, 2x Technical, HR", "diff": "Hard"}, {"name": "Mehta Digital Solutions", "sector": "Web & Mobile", "ctc": "6 LPA", "cgpa": 6.5, "rounds": "Aptitude, Technical, HR", "diff": "Medium"}, {"name": "Gill & Rao Technologies", "sector": "Data & Analytics", "ctc": "7.5 LPA", "cgpa": 7.0, "rounds": "SQL Test, Technical, HR", "diff": "Hard"}, {"name": "Kapoor Software Services", "sector": "IT Services", "ctc": "3.8 LPA", "cgpa": 6.0, "rounds": "Aptitude, Group Round, HR", "diff": "Easy"}, {"name": "Verma Networks", "sector": "Networking / Cloud", "ctc": "5.5 LPA", "cgpa": 6.5, "rounds": "OA, Technical, HR", "diff": "Medium"}];const DC={Easy:"bg-slate-200 text-slate-800",Medium:"bg-slate-300 text-slate-900",Hard:"bg-slate-800 text-white"};
document.getElementById("g").innerHTML=COMPANIES.map(c=>`<div class="bg-white border rounded-xl p-5"><h3 class="font-bold">${c.name}</h3><p class="text-sm text-slate-500">${c.sector}</p>

</script></body></html>
